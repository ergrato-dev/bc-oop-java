name: Verificar contenido

on:
  push:
    branches: [main]
  pull_request:

# Principio de mínimo privilegio: solo lectura
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Estructura, enlaces, navegación, tuteo, uv/pnpm, imágenes y puertos
        run: ./scripts/verificar-enlaces.sh

      - name: shellcheck de scripts/
        run: shellcheck -S warning scripts/*.sh

      # Los starters de proyecto arrancan en rojo a propósito: aquí solo se
      # comprueba que compilan (código y tests) con la imagen fijada.
      - name: Los starters compilan con Java 25
        run: |
          set -euo pipefail
          img=maven:3.10.0-eclipse-temurin-25-noble
          for d in bootcamp/week-*/3-proyecto/starter bootcamp/week-*/2-practicas/*/starter; do
            echo "::group::$d"
            if [ -f "$d/pom.xml" ]; then
              docker run --rm -v "$PWD/$d":/w -w /w "$img" ./mvnw -q -B test-compile
            else
              docker run --rm -v "$PWD/$d":/w -w /w "$img" sh -c 'javac -d /tmp/out *.java'
            fi
            echo "::endgroup::"
          done
