<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
  <title id="t">Construcción en cadena</title>
  <desc id="d">A la izquierda, la llamada new RareBook con código BK-001, título, 1 ejemplar y la sala. Entra en el constructor de RareBook, cuya primera llamada es super con código, título y ejemplares. Eso ejecuta el constructor de Book, que comprueba los ejemplares y asigna code, title y copies, después de construir la parte de Object. Luego vuelve a RareBook, que asigna room. A la derecha, el objeto terminado con sus tres capas: Object, Book y RareBook, construidas de arriba abajo.</desc>
  <rect width="820" height="400" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <rect x="30" y="30" width="460" height="40" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="46" y="56" font-size="13" fill="#86efac">new RareBook("BK-001", "Crónica…", 1, "Sala de fondo antiguo")</text>

    <path d="M60 70 V96" stroke="#e2e8f0" stroke-width="2"/><path d="M60 102 l-5 -8 h10 z" fill="#e2e8f0"/>

    <rect x="30" y="104" width="460" height="128" rx="8" fill="#1e293b" stroke="#86efac" stroke-width="3"/>
    <text x="46" y="128" font-weight="700">Constructor de RareBook</text>
    <text x="46" y="156" font-size="13"><tspan fill="#fde68a">1.</tspan> super(code, title, copies);</text>
    <text x="46" y="214" font-size="13"><tspan fill="#fde68a">3.</tspan> this.room = room;</text>

    <path d="M300 151 H520" stroke="#fde68a" stroke-width="2"/><path d="M528 151 l-8 -5 v10 z" fill="#fde68a"/>
    <rect x="528" y="104" width="262" height="128" rx="8" fill="#1e293b" stroke="#fde68a" stroke-width="3"/>
    <text x="544" y="128" font-weight="700">Constructor de Book</text>
    <text x="544" y="154" font-size="13"><tspan fill="#fde68a">2.</tspan> (antes, la parte de Object)</text>
    <text x="544" y="176" font-size="13">si copies &lt; 0, excepción</text>
    <text x="544" y="198" font-size="13">asigna code, title, copies</text>
    <path d="M520 209 H300" stroke="#fde68a" stroke-width="2"/><path d="M292 209 l8 -5 v10 z" fill="#fde68a"/>
    <text x="330" y="196" font-size="12" fill="#94a3b8">vuelve</text>

    <text x="30" y="270" font-size="16" font-weight="700">El objeto, de arriba abajo</text>
    <rect x="30" y="284" width="250" height="34" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="46" y="306" font-size="13" fill="#94a3b8">Object</text>
    <rect x="30" y="318" width="250" height="34" rx="4" fill="#1e293b" stroke="#fde68a" stroke-width="2"/>
    <text x="46" y="340" font-size="13">Book: code · title · copies</text>
    <rect x="30" y="352" width="250" height="34" rx="4" fill="#1e293b" stroke="#86efac" stroke-width="2"/>
    <text x="46" y="374" font-size="13">RareBook: room</text>

    <text x="320" y="306" font-size="13">Cada capa la construye la clase que sabe cómo.</text>
    <text x="320" y="334" font-size="13">Si Book rechaza los ejemplares, no se llega al paso 3:</text>
    <text x="320" y="354" font-size="13">la validación del padre vale para la subclase.</text>
    <text x="320" y="382" font-size="13" fill="#94a3b8">Sin super(...), Java pone super() y busca un Book() sin argumentos.</text>
  </g>
</svg>
